[package]
name = "koor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["gui"]
gui = ["dep:gtk4"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", optional = true, features = ["v4_8"] }
