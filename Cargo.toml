[package]
name = "koor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", optional = true, features = ["v4_8"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std", "NSActionCell", "NSApplication", "NSAppearance", "NSAttributedString", "NSBitmapImageRep", "NSButton", "NSButtonCell", "NSCell",
    "NSClipView", "NSColor", "NSColorSpace", "NSControl", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSLayoutAnchor",
    "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSPopUpButton", "NSResponder",
    "NSRunningApplication", "NSScrollView", "NSStackView", "NSText", "NSTextContainer", "NSTextField",
    "NSTextView", "NSStringDrawing", "NSUserInterfaceLayout", "NSView", "NSWindow", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSGeometry",
    "NSNotification", "NSObject", "NSRange", "NSRunLoop", "NSString", "NSTimer",
] }
